name: Release to production
run-name: Deploy ${{ inputs.release_tag }} to production

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Verified candidate tag from Releases
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: product-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source: ${{ steps.release.outputs.source }}
      chart: ${{ steps.release.outputs.chart }}
      image: ${{ steps.release.outputs.image }}
      migration: ${{ steps.release.outputs.migration }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate candidate and master
        id: release
        run: |
          [[ "$RELEASE_TAG" =~ ^candidate-[0-9]+\.[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" | jq -e '.draft == false and .immutable == true'
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern release.json --dir "$RUNNER_TEMP/release"
          metadata="$RUNNER_TEMP/release/release.json"
          jq -e --arg repository "ghcr.io/${GITHUB_REPOSITORY,,}" \
            '.image_repository == $repository and
             (.source_revision | test("^[0-9a-f]{40}$")) and (.chart_revision | test("^[0-9a-f]{40}$")) and
             (.image_digest | test("^sha256:[0-9a-f]{64}$")) and (.migration_image_digest | test("^sha256:[0-9a-f]{64}$"))' "$metadata"
          source=$(jq -r .source_revision "$metadata")
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$source"
          test "$(git rev-parse "$source^{tree}")" = "$(git rev-parse 'HEAD^{tree}')"
          git merge-base --is-ancestor "$source" HEAD
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)" = "$GITHUB_SHA"
          run=$(jq -r .build_run "$metadata")
          [[ "$run" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" | jq -e --arg source "$source" \
            '.head_sha == $source and .event == "push" and (.head_branch | startswith("release/")) and
             .path == ".github/workflows/checks.yml" and .conclusion == "success"'
          printf 'source=%s\nchart=%s\nimage=%s\nmigration=%s\n' "$source" \
            "$(jq -r .chart_revision "$metadata")" "$(jq -r .image_digest "$metadata")" \
            "$(jq -r .migration_image_digest "$metadata")" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify original images
        env:
          SOURCE: ${{ steps.release.outputs.source }}
          APPLICATION: ghcr.io/${{ github.repository }}@${{ steps.release.outputs.image }}
          MIGRATION: ghcr.io/${{ github.repository }}@${{ steps.release.outputs.migration }}
        run: |
          docker pull "$APPLICATION"
          docker pull "$MIGRATION"
          for image in "$APPLICATION" "$MIGRATION"; do
            test "$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$SOURCE"
            test "$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.source"}}' "$image")" = "https://github.com/$GITHUB_REPOSITORY"
          done
          test "$(docker image inspect -f '{{index .Config.Labels "io.sellgar.image-role"}}' "$APPLICATION")" = application
          test "$(docker image inspect -f '{{index .Config.Labels "io.sellgar.image-role"}}' "$MIGRATION")" = migration

  delivery:
    needs: validate
    uses: pyatakovvg/sellgar.infrastructure/.github/workflows/deliver-service.yml@delivery-v0.5.2
    secrets:
      SUBMODULES_READ_TOKEN: ${{ secrets.SUBMODULES_READ_TOKEN }}
    with:
      environment: prod
      namespace: sellgar-prod
      release-name: product-service
      source-revision: ${{ needs.validate.outputs.source }}
      chart-revision: ${{ needs.validate.outputs.chart }}
      image-digest: ${{ needs.validate.outputs.image }}
      migration-image-digest: ${{ needs.validate.outputs.migration }}

  back-merge:
    needs: delivery
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Open master to development PR
        run: |
          ahead=$(gh api "repos/$GITHUB_REPOSITORY/compare/development...master" --jq .ahead_by)
          if [[ "$ahead" == 0 ]]; then exit 0; fi
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --base development --head master --state open --json url --jq '.[0].url // ""')
          if [[ -n "$existing" ]]; then printf '%s\n' "$existing"; exit 0; fi
          gh pr create --repo "$GITHUB_REPOSITORY" --base development --head master \
            --title 'chore: merge master into development' \
            --body 'Return the deployed release to development. Review and merge after checks.'
