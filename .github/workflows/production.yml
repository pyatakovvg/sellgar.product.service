name: Release to production
run-name: Release candidate ${{ inputs.release_run_id }} to production

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: 'ID успешного CI запуска ветки release/* (из Summary сборки)'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: product-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      image: ${{ steps.promote.outputs.image }}
      image_repository: ${{ steps.promote.outputs.image_repository }}
      image_digest: ${{ steps.promote.outputs.image_digest }}
      migration_image_digest: ${{ steps.promote.outputs.migration_image_digest }}
      source_commit: ${{ steps.promote.outputs.source_commit }}
      master_commit: ${{ steps.promote.outputs.master_commit }}
    steps:
      - name: Checkout release tooling from master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate selected release build
        run: python3 -B .github/scripts/release.py check-run "$RELEASE_RUN_ID"

      - name: Download selected release manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-manifest
          path: ${{ runner.temp }}/release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.release_run_id }}

      - name: Verify release matches master
        id: verify
        run: python3 -B .github/scripts/release.py verify "$RELEASE_RUN_ID" "$RUNNER_TEMP/release"

      - name: Login to GHCR for reading
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published image and run smoke
        env:
          IMAGE: ${{ steps.verify.outputs.image }}
          MIGRATION_IMAGE: ${{ steps.verify.outputs.migration_image }}
          SOURCE_COMMIT: ${{ steps.verify.outputs.source_commit }}
        shell: bash
        run: |
          docker pull "$IMAGE"
          docker pull "$MIGRATION_IMAGE"
          revision=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE")
          source=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' "$IMAGE")
          test "$revision" = "$SOURCE_COMMIT"
          test "$source" = "https://github.com/$GITHUB_REPOSITORY"
          test "$(docker image inspect --format '{{index .Config.Labels "io.sellgar.image-role"}}' "$IMAGE")" = application
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$MIGRATION_IMAGE")" = "$SOURCE_COMMIT"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' "$MIGRATION_IMAGE")" = "https://github.com/$GITHUB_REPOSITORY"
          test "$(docker image inspect --format '{{index .Config.Labels "io.sellgar.image-role"}}' "$MIGRATION_IMAGE")" = migration
          python3 -B .github/scripts/smoke-image.py "$IMAGE" "$MIGRATION_IMAGE"

      - name: Prepare approved production release
        id: promote
        run: python3 -B .github/scripts/release.py promote "$RELEASE_RUN_ID" "$RUNNER_TEMP/release"

      - name: Export production release for deployment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-release
          path: ${{ runner.temp }}/release/production/
          if-no-files-found: error
          overwrite: true
          retention-days: 90

      - name: Checkout pinned delivery tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pyatakovvg/sellgar.infrastructure
          ref: 2d5fdbc6b74515e5a9dc35d9e89b734eac5625a0
          path: delivery
          sparse-checkout: |
            .github/actions/publish-helm
            charts/application
          persist-credentials: false

      - name: Publish approved production release
        uses: ./delivery/.github/actions/publish-helm
        with:
          environment: prod
          source-commit: ${{ steps.promote.outputs.source_commit }}
          image-digest: ${{ steps.promote.outputs.image_digest }}
          migration-image-digest: ${{ steps.promote.outputs.migration_image_digest }}
          release-name: product-service
          github-token: ${{ secrets.GITHUB_TOKEN }}

  back-merge:
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open master to development pull request
        run: python3 -B .github/scripts/release.py back-merge
